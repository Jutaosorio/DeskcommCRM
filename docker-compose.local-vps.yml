# DeskcommCRM — Stack Docker local estilo VPS conectada ao Supabase Cloud.
# Sobe: app (http://localhost:3010), waha (http://localhost:3030), worker, scheduler, redis e srh.
name: deskcomm-vps-local

services:
  app:
    build: .
    image: deskcommcrm:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "3010:3000"
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/melgarafael/deskcomm-worker:stable}
    restart: unless-stopped
    env_file: .env
    environment:
      WAHA_API_BASE_URL: http://waha:3000
    depends_on:
      app:
        condition: service_healthy
      waha:
        condition: service_started
      srh:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/melgarafael/deskcomm-scheduler:stable}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: deskcomm2026
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: deskcomm2026
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - internal

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  wacalls:
    image: ${WACALLS_IMAGE:-ghcr.io/jotadev66/wacalls@sha256:9ff52ef9455cf42125a911c38bb8c855f0cc205516cada2054e5c05546909022}
    pull_policy: missing
    restart: unless-stopped
    environment:
      WACALLS_ADMIN_USER: ${WACALLS_ADMIN_USER:-admin}
      WACALLS_ADMIN_PASSWORD: ${WACALLS_ADMIN_PASSWORD:-deskcomm2026}
      WACALLS_API_TOKEN: ${WACALLS_API_TOKEN}
      WACALLS_CORS_ORIGINS: ""
      WACALLS_TRUSTED_PROXIES: ""
      WACALLS_PUBLIC_IP: ${WACALLS_PUBLIC_IP:-127.0.0.1}
      WACALLS_WEBRTC_UDP_PORT: ${WACALLS_WEBRTC_UDP_PORT:-7881}
    ports:
      - "${WACALLS_WEBRTC_UDP_PORT:-7881}:${WACALLS_WEBRTC_UDP_PORT:-7881}/udp"
    volumes:
      - wacalls-data:/data
    networks:
      - internal

volumes:
  waha-data:
  waha-media:
  wacalls-data:

networks:
  internal:
    driver: bridge

