# Staging local isolado. Nunca inclua este arquivo no compose de producao.
name: deskcomm-local

services:
  proxy:
    profiles: ["local"]
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./docker/local/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [local]

  app:
    profiles: ["local"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.docker.local
    extra_hosts:
      - "supabase.localhost:host-gateway"
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [local]

  worker:
    profiles: ["local"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env.docker.local
    environment:
      WAHA_API_BASE_URL: http://waha:3000
    extra_hosts:
      - "supabase.localhost:host-gateway"
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [local]

  scheduler:
    profiles: ["local"]
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    env_file: .env.docker.local
    depends_on:
      app:
        condition: service_healthy
    networks: [local]

  waha:
    profiles: ["local"]
    image: devlikeapro/waha:latest-2026.7.2
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY_SHA512}
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "true"
      WHATSAPP_RESTART_ALL_SESSIONS: "false"
    volumes:
      - waha-local-sessions:/app/.sessions
      - waha-local-media:/app/.media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [local]

  redis:
    profiles: ["local"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [local]

  srh:
    profiles: ["local"]
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [local]

volumes:
  waha-local-sessions:
  waha-local-media:

networks:
  local:
    driver: bridge
